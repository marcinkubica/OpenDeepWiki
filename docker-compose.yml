services:
  koalawiki:
    build:
      context: .
      dockerfile: src/KoalaWiki/Dockerfile
    environment:
      - KOALAWIKI_REPOSITORIES=/repositories
      - TASK_MAX_SIZE_PER_USER=5 # Maximum parallel document generation tasks per user for AI
      - REPAIR_MERMAID=1 # Whether to perform Mermaid repair (1 = yes, 0 = no)
      - CHAT_MODEL=grok-code-fast-1 # AI model (must support function calling)
      - ANALYSIS_MODEL=grok-code-fast-1 # Analysis model for generating repository directory structure
      - ENDPOINT=http://host.orb.internal:4141 # Local Anthropic-compatible endpoint
      # - CHAT_MODEL=gpt-oss:20b # AI model (must support function calling)
      # - ANALYSIS_MODEL=gpt-oss:20b # Analysis model for generating repository directory structure
      # - ENDPOINT=http://host.orb.internal:11434/v1
      - CHAT_API_KEY=dummy-local-api-key-for-testing
      - LANGUAGE=English # Default generation language
      - MODEL_PROVIDER=OpenAI # Model provider (OpenAI, AzureOpenAI)
      - DB_TYPE=sqlite
      - DB_CONNECTION_STRING=Data Source=/data/KoalaWiki.db
      - UPDATE_INTERVAL=5 # Repository incremental update interval (days)
      - EnableSmartFilter=true # Enable smart filtering
      - ENABLE_INCREMENTAL_UPDATE=true # Enable incremental updates
      - ENABLE_CODED_DEPENDENCY_ANALYSIS=false # Enable code dependency analysis
      - ENABLE_WAREHOUSE_FUNCTION_PROMPT_TASK=false # Enable MCP Prompt generation
      - ENABLE_WAREHOUSE_DESCRIPTION_TASK=false # Enable repository Description generation
      - OTEL_SERVICE_NAME=koalawiki
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    ports:
        - "8080:8080"
    volumes:
      - ./repositories:/app/repositories
      - ./data:/data

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard
    container_name: aspire-dashboard
    restart: always
    ports:
      - "18888:18888"
    environment:
      - TZ=Europe/London
      - Dashboard:ApplicationName=Aspire
